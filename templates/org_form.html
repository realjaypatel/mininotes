<!-- USERS -->
<div>
  <label class="block mb-1 font-medium">Users</label>
  <div class="flex gap-2 mb-2">
    <div id="users-container" class="flex flex-wrap gap-2 border rounded-md p-2 min-h-[48px] cursor-text" onclick="userInput.focus()"></div>
  </div>
  <div class="flex gap-2">
    <input type="text" id="userInput" class="flex-1 px-2 py-1 border rounded-md focus:outline-none focus:ring-2 focus:ring-slate-400" placeholder="Type email">

  </div>
  <input type="hidden" name="users" id="users-hidden" value="{{ org.users | join(',') if org and org.users else '' }}">
</div>

<!-- CATEGORIES -->
<div>
  <label class="block mb-1 font-medium">Categories</label>
  <div class="flex gap-2 mb-2">
    <div id="categories-container" class="flex flex-wrap gap-2 border rounded-md p-2 min-h-[48px] cursor-text" onclick="categoryInput.focus()"></div>
  </div>
  <div class="flex gap-2">
    <input type="text" id="categoryInput" class="flex-1 px-2 py-1 border rounded-md focus:outline-none focus:ring-2 focus:ring-slate-400" placeholder="Type category">
    <button type="button" id="addCategoryBtn" class="px-3 py-1 bg-slate-900 text-white rounded-md hover:bg-slate-700 transition">Enter</button>
  </div>
  <input type="hidden" name="categories" id="categories-hidden" value="{{ org.categories | join(',') if org and org.categories else '' }}">
</div>

<button type="submit" class="px-4 py-2 bg-slate-900 text-white rounded-md hover:bg-slate-700 transition">
  {{ action }}
</button>

<script>
/* ---------- USERS ---------- */
const userContainer = document.getElementById('users-container');
const userInput = document.getElementById('userInput');
const userHidden = document.getElementById('users-hidden');
const addUserBtn = document.getElementById('addUserBtn');

let users = userHidden.value ? userHidden.value.split(',') : [];

function renderUsers() {
  userContainer.innerHTML = '';
  users.forEach((user, idx) => {
    const tag = document.createElement('span');
    tag.className = "px-2 py-1 bg-slate-200 rounded-md flex items-center gap-1";
    tag.innerHTML = `${user} <button type="button" onclick="removeUser(${idx})" class="text-xs">x</button>`;
    userContainer.appendChild(tag);
  });
  userHidden.value = users.join(',');
}

function removeUser(idx) {
  users.splice(idx, 1);
  renderUsers();
}

function addUser() {
  const val = userInput.value.trim();
  if(val !== '' && !users.includes(val)) {
    users.push(val);
    userInput.value = '';
    renderUsers();
  }
}

userInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    addUser();
  }
});
addUserBtn.addEventListener('click', addUser);
renderUsers();

/* ---------- CATEGORIES ---------- */
const catContainer = document.getElementById('categories-container');
const categoryInput = document.getElementById('categoryInput');
const catHidden = document.getElementById('categories-hidden');
const addCatBtn = document.getElementById('addCategoryBtn');

let categories = catHidden.value ? catHidden.value.split(',') : [];

function renderCategories() {
  catContainer.innerHTML = '';
  categories.forEach((cat, idx) => {
    const tag = document.createElement('span');
    tag.className = "px-2 py-1 bg-slate-200 rounded-md flex items-center gap-1";
    tag.innerHTML = `${cat} <button type="button" onclick="removeCategory(${idx})" class="text-xs">x</button>`;
    catContainer.appendChild(tag);
  });
  catHidden.value = categories.join(',');
}

function removeCategory(idx) {
  categories.splice(idx, 1);
  renderCategories();
}

function addCategory() {
  const val = categoryInput.value.trim();
  if(val !== '' && !categories.includes(val)) {
    categories.push(val);
    categoryInput.value = '';
    renderCategories();
  }
}

categoryInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    addCategory();
  }
});
addCatBtn.addEventListener('click', addCategory);
renderCategories();
</script>

{% endblock %}
